- slug: egrid-model-lineage-rebuild
  axis_scores:
    technical_depth: 8
    voice: 9
    validation: 9
  axis_reasoning:
    technical_depth: 'Three tools are given three separate jobs and wired so that each carries evidence the
      others cannot: Git for source history, DVC for the workbook bytes behind an MD5 pointer with the 21 MB
      file held outside the repository on an external remote, and MLflow for runs and registered versions with
      a champion alias so the checker has one curated target. Two data revisions are tracked end to end, 932a841d
      and 2449e137, each with its own registered version, and an executable schema gate runs ahead of training.
      The toolchain is pinned at Python 3.13, MLflow 3.17.1 and DVC 3.67.1 with the versions written to
      check-out.txt. Held at 8 rather than higher because the lab is one local workstation and the three tools
      are standard pieces correctly assembled rather than anything built from scratch.'
    voice: 'The register declines the flattering version at each point where one was available. The overrun is
      stated plainly at about one and a half hours against a 45-minute plan, broken into its four parts, with
      the cause named as a model-logging error resolved by pinning an older skops and time lost locating the
      revision 1 workbook on the EPA site. The unregistered diagnostic run is described as a tracking run rather
      than a model release, which is the honest reading of an artifact that could easily have been presented as
      a third version. The shared DVC remote and hosted MLflow server that would let a team reproduce this from
      separate machines are named as the next goal rather than implied to exist.'
    validation: 'Two engineered failures, not one, and a recovery between them. The clean clone carried the code
      and the DVC metadata but not the bytes: the commit check passed, the ROC AUC check passed, and the run
      still failed on data_md5, which is what proves Git alone cannot rebuild or verify the model. dvc pull then
      restored the exact workbook, the hash matched 2449e137, and a forced retrain returned three PASS lines and
      ALL CHECKS PASS at 0.914372. The stale-data run is the sharper of the two: revision 1 still printed SCHEMA
      OK and still passed ROC AUC at 0.9137, so it was acceptable on every check except identity, and the
      fingerprint rejected it at exit code 1 while the registry stayed at two versions. The acceptance criteria
      naming each required line were committed before any model code existed.'
  average: 8.67
  rationale: Schema and ROC AUC both passed on the wrong workbook; the MD5 fingerprint caught it at exit 1
  featured: true
- slug: retrieval-rerank-benchmark
  axis_scores:
    technical_depth: 8
    voice: 9
    validation: 9
  axis_reasoning:
    technical_depth: 'Four retrieval stages built and compared on one benchmark: dense with
      bge-small-en-v1.5, sparse with bm25s, reciprocal rank fusion at constant 60, and a
      bge-reranker-v2-m3 cross-encoder confined to the same 50 candidates so it reorders a fixed pool
      rather than introducing documents the retrievers never surfaced. A shared loader returns one corpus,
      one query list and one label map that all four rows consume, with identifiers cast to strings, so a
      changed score is attributable to the ranking method. The toolchain is pinned to named versions with
      the models and SciFact cached locally, which takes network time out of the measured path. Held at 8
      because the sample is 20 queries on one workstation and the full test was never run.'
    voice: 'The register refuses the easy claim at every turn. Scope is declared as the 20-query run only,
      with clinical guidelines, generated answers and the full test named as owed rather than reported.
      The 300-query test is left unrun at an estimated 4.5 to 5 hours and no smaller stand-in is invented
      to fill the gap. And the readout is turned on its own repository: trace-scored at 3 untraceable
      claims out of 88, the three removed rather than explained, the teach-back losing two unsupported
      method phrases, the after-action review dropping a claim of surprise that no retained evidence
      recorded, and the original score preserved rather than rewritten after the correction.'
    validation: 'The strongest scorer discipline in the pillar. The nDCG denominator was deliberately
      broken, the fixture expected 0.4982 and received 0.6509, and that failure was retained in
      check-out.txt with the broken line left uncommitted, so a faulty calculation could not pass as a
      quality gain merely for producing a larger number. Restoring the denominator returned the fixture to
      0.4982, and an empty git diff on metrics.py proves the working scorer matches the committed passing
      version. The result is signed rather than spun: Recall@5 at -0.025 against nDCG@5 at +0.072, read
      beside a p95 of 60,388 ms, which is what makes the decision defensible instead of a preference.'
  average: 8.67
  rationale: Recall fell and nDCG rose at a p95 of 60,388 ms, after a broken scorer proved the metric
  featured: true
- slug: evidence-first-threat-model
  axis_scores:
    technical_depth: 8
    voice: 9
    validation: 9
  axis_reasoning:
    technical_depth: A pytm 1.4.0 model in which every property traces to a written design claim, a
      local Git evidence chain whose commits are split by stage, a pre-run verification that records
      seven design files and the prediction set present while out.json and dfd.dot are absent, local
      prediction rows for concerns the tool might not generate, a six-check validator that returns
      non-zero on any failure, a threat register requiring named owners and PM acceptance on High and
      Very High findings, an isolated claim-flip run, and an offline HTML evidence pack. The design
      pipeline is deep; the runtime surface is a model plus a validator, which holds depth at 8.
    voice: 'The title (The Diagram That Argues Back) and the framing (findings that challenge the design
      without rewriting what was expected) are the most distinctive in the pillar, and the recall
      paragraph lands the two-sided lesson in one clause: pytm found two items the review missed, while
      the review identified three concerns the tool did not report. Every sentence carries a fact, and
      the doc names its own limit on Git ordering and what stronger preservation would cost.'
    validation: A deliberate must-fail run with the register absent, committed before the register
      existed, then a pass on all six checks with EXIT 0, recall 7 of 9 and an unmatched rate of 3 of 10,
      and a sensitivity test where flipping isThirdParty took 126 findings to 125, removing exactly one
      (LLM03) with the original out.json preserved. Predictions provably preceded findings via the
      pre-run True and False record and the design commit. The do-not-trust-the-confident-answer reflex
      is exercised in both directions, review versus tool.
  average: 8.67
  rationale: STRIDE predictions committed before pytm ran, a must-fail ownership check, and recall 7 of
    9
  featured: true
- slug: medallion-reconciliation-pipeline
  axis_scores:
    technical_depth: 8
    voice: 8
    validation: 9
  axis_reasoning:
    technical_depth: 'A real three-layer dbt project on DuckDB over roughly 3.5 million rows, with one reusable
      valid_trip macro as the single declared rule so validity cannot be described differently in two places,
      a reconciliation test that counts the bronze side independently rather than trusting the chain, and a
      repository that tracks models, macros, tests and evidence while keeping Parquet downloads, the virtual
      environment, dbt target output and the database file out of history. Fully local on an embedded engine,
      which is what holds it at 8: no remote storage, permissions, scheduling or orchestration is exercised,
      and the document names that as the next step rather than claiming it.'
    voice: 'The register is bounded throughout. The headline claim is stated and then immediately narrowed:
      reconciliation shows the layers follow the declared rule and cannot show the rule is the right business
      definition of a valid taxi trip, which is handed back to the people who own the data. The must-fail run
      is labelled an expected failure created for validation rather than evidence of a broken pipeline, and
      the second-month check is explained as proving what the pipeline excludes as well as what it includes.
      One below the top because the layer responsibilities and the narrow-claim caveat are each restated three
      times across the contract, build and reflection phases.'
    validation: 'The strongest evidence shape in the pillar. A baseline zero-difference pass, then a controlled
      defect that removed only the silver filter while leaving gold and the test untouched, so the failure was
      attributable to one boundary: silver passed every row forward, gold expanded, the unchanged bronze-side
      count mismatched, and the build returned one failed result with exit code 1. Restoring the filter
      returned the zero difference, giving three connected results rather than one. The second-month check is
      the other direction: landing June beside July took files from 1 to 2 while bronze held at 3,530,109 and
      silver and gold both at 3,388,734, so scope was proven to come from the written boundary rather than
      from file presence.'
  average: 8.33
  rationale: Removing one silver filter expanded gold and failed the unchanged reconciliation at exit 1
  featured: true
- slug: iam-permissions-boundary-proof
  axis_scores:
    technical_depth: 8
    voice: 8
    validation: 9
  axis_reasoning:
    technical_depth: Real AWS resources (BoundaryProofRole, BoundaryProofCeiling), three separate policy
      inputs, eight predictions frozen in CSV, a six-check manifest, simulate-principal-policy run as
      a control before attachment and again after, attachment proven by a fresh get-role read, dependency-ordered
