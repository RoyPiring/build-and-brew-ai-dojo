- slug: observable-health-check-service
  axis_scores:
    technical_depth: 7
    voice: 8
    validation: 7
  axis_reasoning:
    technical_depth: 'A small but complete Flask service: /livez with no socket, /readyz opening TCP to
      a killable store.py with a one-second timeout, OpenTelemetry spans to a local JSON-lines file, four
      required environment variables with fail-fast on absence, and a SIGINT drain that flips readiness
      first and holds liveness for two seconds on a daemon thread. Four ADRs and a C4 container view came
      first. The scope is a single process with one dependency, so it is lighter than the control-plane
      and evidence-pipeline builds.'
    voice: The README frames the problem sharply (one endpoint is answering the wrong question) and names
      the failure mode it is designed against, the restart storm. The four defended decisions are specific.
      The central 503/200 assertion is restated in three places across the document, which is the one
      stretch of repetition.
    validation: 'The kill drill is a real negative test with observed output on both endpoints, the drain
      window was observed, and the build closed on a verified v1.0.0 release with six screenshots. The
      AI-scoring reflex is weak here: the document admits the draft already separated the routes, so the
      ADR-01 correction was precautionary rather than a caught error. Evidence is manual observation,
      not an automated suite.'
  average: 7.33
  rationale: 'Store killed: /readyz drops to 503 while /livez holds 200, then a SIGINT drain proves Factor
    IX'
  featured: false
- slug: coverage-checked-decision-log
  axis_scores:
    technical_depth: 6
    voice: 5
    validation: 8
  axis_reasoning:
    technical_depth: 'A local Git repository, a standard-library Python checker, and markdown records:
      no running service, no cloud resource, no test harness beyond the checker itself. What lifts it
      above the other process build in the pillar is one real mechanic, a coverage denominator committed
      before any record exists and then grown by a scan of workload/main.tf from four rows to nine, with
      the Terraform left unmodified so discovery cannot change what is being measured. The checker also
      enforces structure, a required Consequences heading and two-way supersession links.'
    voice: 'The three sections that carry content are sharp: a RECORDED driver ties a fact to a source
      so the next owner can check the claim instead of trusting a retelling, a NOT RECORDED driver keeps
      the missing reason as a question so nobody fills the gap with an invented rationale, and the audit
      section states plainly that the draft''s own self-scored line was cut for lack of a source. The
      rest of the document is template scaffolding: five of seven phases open with In this step, I am,
      state an intention, and stop, so the build has to be reconstructed from the three sections and the
      screenshots. The thinnest prose in the pillar.'
    validation: 'Counted results at every turn rather than assertions: six settings found against four
      note rows with the five missing ones named, the denominator moved four to nine, two deliberate
      failures kept as evidence with the cause named in each message and exit 1 in both, records restored
      before the clean pass, and the handover audited from 3 of 28 traced claims down to zero unsupported
      claims with the three cut ones itemised. Held at 8 because the counts are reported rather than
      shown, and the log and its history stay local, so ordering is inspectable rather than tamper-proof.'
  average: 6.33
  rationale: A checker grew the decision denominator 4 to 9, and two must-fail runs held the record format
  featured: false
- slug: ship-your-first-card-through-github
  axis_scores:
    technical_depth: 4
    voice: 6
    validation: 6
  axis_reasoning:
    technical_depth: 'A Foundation-tier process build: repo, board, two issues, a feature branch, a PR
      with closing keywords, and a tagged release, with Ollama and Gemma 3 drafting the card. There is
      no code, no running service, and no test harness. The diagram names the real gate commands (git
