      rather than a deployed service, which keeps depth at 8.
    voice: 'The README is close to reference quality: the boundary as an assumption not a control, four
      outcomes kept apart as the real lesson, intersection semantics made visible, and a perfect score
      written afterwards proves nothing. The supporting document is careful and precise but caveat-dense,
      and its final sentence is truncated mid-word (reproduce the), a defect the public repo currently
      carries.'
    validation: 'The strongest evidence chain of the eight: an unbounded control returned allowed for
      CreatePolicyVersion first, then AllowedByPermissionsBoundary false after the ceiling attached; explicit
      deny, implicit deny, boundary refusal, and mutual allow kept as four distinct results; 8 of 8 against
      predictions that existed before any output; teardown graded by fresh NoSuchEntity reads rather than
      delete commands; and an optional check that returned FAIL kept visible without touching the score.
      Failure modes and cleanup are both validated.'
  average: 8.33
  rationale: Eight IAM decisions frozen before the simulator ran, 8 of 8 held, teardown proven by NoSuchEntity
  featured: true
- slug: typed-crossplane-platform-api
  axis_scores:
    technical_depth: 9
    voice: 8
    validation: 8
  axis_reasoning:
    technical_depth: 'The most infrastructure-heavy build of the eight: a kind cluster, Crossplane 2.4.0
      by Helm, provider-kubernetes with ProviderConfigs, Function Patch and Transform, a namespaced ApplicationEnvironment
      XRD with field-level CEL rules, and a Composition producing a Deployment and a Service. The contract
      pack fixed boundary, behaviors, and evidence before implementation, and the AI proposal was kept
      as a separate evidence file rather than converted into policy. The diagram traces both admission
      and reconciliation paths and the legacy v1 control.'
    voice: The README opens with the platform problem in the developer's terms (re-derive the platform's
      opinions each time, and get them wrong differently each time) and the reconciliation line (a one-time
      generator could produce the first Deployment, but it cannot explain the return) is the kind of sentence
      that teaches. The document is more formal and expository than the README, with several sentences
      restating the admission-before-storage ordering.
    validation: 'Both halves of the contract are tested: an unpinned image tag refused on a server-side
      dry run with nothing stored, and the queue-api Deployment returning NotFound then restored to 1/1
      with no second apply. The legacy v1 XRD passing admission at exit code 0 is a documented trap, resolved
      by a scope script printing Namespaced. Human corrections to the AI draft are recorded in the readout.
      Held at 8 because there is no automated suite (named as the next step) and the evidence is six screenshots
      plus narrative.'
  average: 8.33
  rationale: CEL refuses an unpinned image before storage; a deleted Deployment comes back at 1/1 unaided
  featured: false
